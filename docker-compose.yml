services:
  postgres:
    image: postgres:16-alpine
    container_name: morada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    ports:
      - "55433:5432"
    volumes:
      - morada_pg:/var/lib/postgresql/data

volumes:
  morada_pg:
